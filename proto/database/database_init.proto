syntax = "proto3";

package database_init;

option go_package = "github.com/vwency/microservices_golang/proto/database_init";

service DatabaseInitService {
  rpc InitDatabase (InitRequest) returns (InitResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc AddUser (AddUserRequest) returns (AddUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
}

message InitRequest {
  string config_path = 1;
}

message InitResponse {
  bool success = 1;
  string message = 2;
}

message GetUserRequest {
  string username = 1;
  string email = 2;
}

message GetUserResponse {
  bool found = 1;
  string user_id = 2; // This should be the user_id, not just the username.
  string username = 3; 
  string email = 4;
  string hashedRt = 5;
  string hashedPassword = 6;
  string hashedAt = 7;
  string message = 8;
}

message AddUserRequest {
  string username = 1;
  string hashedPassword = 2;
  string hashedRt = 3;
  string accessRt = 4;
  string email = 5;
}

message AddUserResponse {
  bool success = 1;
  string message = 2;
}

message UpdateUserRequest {
  string username = 1;
  string hashedRt = 2;
  string accessRt = 3;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
}
