syntax = "proto3";

package user_database;

option go_package = "github.com/vwency/microservices_golang/proto/user_database";

service DatabaseInitService {
  rpc InitDatabase (InitRequest) returns (InitResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetUserByID (GetUserByIDRequest) returns (GetUserByIDResponse);
  rpc AddUser (AddUserRequest) returns (AddUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

message InitRequest {
  string config_path = 1;
}

message InitResponse {
  bool success = 1;
  string message = 2;
}

message GetUserRequest {
  optional string username = 1;
  optional string email = 2;
  optional string user_id = 3;
}

message GetUserResponse {
  bool found = 1;
  string user_id = 2;
  string username = 3;
  string email = 4;
  string hashed_password = 5;
  string hashed_refresh_token = 6;
  string hashed_access_token = 7;
  string message = 8;
}

message GetUserByIDRequest {
  string user_id = 1;
}

message GetUserByIDResponse {
  bool found = 1;
  string user_id = 2;
  string username = 3;
  string email = 4;
  string hashed_password = 5;
  string hashed_refresh_token = 6;
  string hashed_access_token = 7;
  string message = 8;
}

message AddUserRequest {
  string username = 1;
  string hashed_password = 2;
  string email = 3;
  string hashed_refresh_token = 4;
  string hashed_access_token = 5;
  optional string user_id = 6;
}

message AddUserResponse {
  bool success = 1;
  string message = 2;
}

message UpdateUserRequest {
  string user_id = 1;
  string hashed_refresh_token = 2;
  string hashed_access_token = 3;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
}

// New messages for DeleteUser RPC
message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}